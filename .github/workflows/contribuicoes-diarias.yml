name: Atualizar contribuições diárias

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/**
      - tests/**
      - .github/workflows/contribuicoes-diarias.yml
  schedule:
    - cron: '3-59/5 * * * *'
  pull_request:
    paths:
      - README.md
      - scripts/**
      - tests/**
      - .github/workflows/contribuicoes-diarias.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-contributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Validar coleta real sem publicar na main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_daily_contributions.py
      - name: Disponibilizar captura oficial para revisão
        uses: actions/upload-artifact@v4
        with:
          name: contributions-preview
          path: assets/contribuicoes.json
          retention-days: 7
  update:
    if: github.event_name != 'pull_request' && github.repository == 'juniordev830/juniordev830'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar gerador do painel
        run: python -m unittest discover -s tests -v
      - name: Consultar API oficial e atualizar painel e gráfico
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_daily_contributions.py
      - name: Salvar README somente quando os números ou a data mudarem
        run: |
          git add README.md assets/contribuicoes-diarias.svg assets/contribuicoes.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(profile): atualizar contagens diárias reais'
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

