name: Atualizar contribuições diárias

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/render_daily_contributions.py
      - tests/test_daily_contributions.py
      - scripts/render_portfolio_progress.py
      - tests/test_portfolio_progress.py
      - scripts/verify_profile_panels.py
      - tests/test_panel_integrity.py
      - .github/workflows/contribuicoes-diarias.yml
  # O agendador do GitHub é best-effort: pode atrasar ou perder chamadas.
  # Minutos deslocados do começo da hora reduzem colisões, mas não garantem SLA.
  schedule:
    - cron: '3-58/5 * * * *'
  # Acionamento autenticado por um agendador externo independente, se configurado.
  repository_dispatch:
    types: [refresh-profile]
  pull_request:
    paths:
      - README.md
      - scripts/render_daily_contributions.py
      - tests/test_daily_contributions.py
      - scripts/render_portfolio_progress.py
      - tests/test_portfolio_progress.py
      - scripts/verify_profile_panels.py
      - tests/test_panel_integrity.py
      - .github/workflows/contribuicoes-diarias.yml
  workflow_dispatch:
    inputs:
      refresh_portfolio:
        description: 'Reauditar todos os projetos agora, mesmo dentro da janela de 6 horas'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Serializa os trabalhos no mesmo branch, em vez de cancelar uma atualização no meio.
concurrency:
  group: profile-contributions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'juniordev830/juniordev830'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar o gerador do painel
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Consultar GitHub e publicar painel com retry seguro
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PORTFOLIO_REFRESH: ${{ inputs.refresh_portfolio == true || github.event.client_payload.refresh_portfolio == true }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Em caso de push concorrente, sempre recomeçar com o remoto atualizado.
          # Só os arquivos gerados são adicionados ao commit: nada de force-push.
          for attempt in 1 2 3 4 5; do
            echo "Atualização do painel: tentativa ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            python scripts/render_daily_contributions.py
            if ! python scripts/render_portfolio_progress.py; then
              echo '::warning::Auditoria do portfolio falhou; o painel de contribuicoes continua independente.'
            fi
            python scripts/verify_profile_panels.py
            git add README.md assets/contribuicoes-diarias.svg assets/contribuicoes-diarias.json assets/portfolio-andamento.svg docs/ANDAMENTO_DOS_PROJETOS.md

            if git diff --cached --quiet; then
              echo "Calendário ainda sem mudanças confirmadas pelo GitHub."
              exit 0
            fi

            git commit -m 'chore(profile): sincronizar contagens oficiais'
            if git push origin HEAD:main; then
              echo "Dados do painel publicados na main."
              exit 0
            fi

            echo "A main mudou durante a publicação; consultando novamente."
            sleep "${attempt}"
          done

          echo "::error::Não foi possível publicar após cinco tentativas; números antigos preservados."
          exit 1
