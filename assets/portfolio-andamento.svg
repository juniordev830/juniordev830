<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="602" viewBox="0 0 1060 602"><rect width="1060" height="602" fill="#0d141e" rx="18"/><rect x="1" y="1" width="1058" height="600" rx="17" fill="none" stroke="#303d49"/><text x="45" y="70" fill="#83b7d3" font-size="15" font-family="Arial">PORTFOLIO / ENGENHARIA</text><text x="45" y="135" fill="#f0f5fa" font-size="35" font-weight="bold" font-family="Arial">Andamento tecnico dos projetos</text><text x="45" y="180" fill="#98aabd" font-size="19" font-family="Arial">Indicadores baseados em codigo, testes, documentacao e CI.</text><rect x="45" y="220" width="970" height="230" rx="14" fill="#14212d" stroke="#344555"/><text x="80" y="300" fill="#e3ebf1" font-size="26" font-family="Arial">Sincronizacao inicial pendente</text><text x="80" y="350" fill="#a8b9c7" font-size="18" font-family="Arial">A primeira execucao do workflow preenchera os dados verificados.</text><text x="45" y="520" fill="#8ca8bb" font-size="16" font-family="Arial">Nenhum percentual de conclusao e estimado.</text></svg>