<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-labelledby="title description">
  <title id="title">Apoie meus estudos</title>
  <desc id="description">Se algum dos meus projetos te ajudou, considere contribuir voluntariamente para apoiar meus estudos e formação em tecnologia. Abra o QR Code Pix para contribuir. Obrigado pelo apoio! 💙</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#111920"/>
      <stop offset="1" stop-color="#0d141b"/>
    </linearGradient>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#151d24"/>
      <stop offset="1" stop-color="#121a22"/>
    </linearGradient>
    <linearGradient id="button" x2="0" y2="1">
      <stop stop-color="#1c2a35"/>
      <stop offset="1" stop-color="#16212a"/>
    </linearGradient>
    <linearGradient id="header-rule" gradientUnits="userSpaceOnUse" x1="480" y1="30" x2="829" y2="30">
      <stop stop-color="#284554"/>
      <stop offset="1" stop-color="#55b3df"/>
    </linearGradient>
    <radialGradient id="header-glow">
      <stop stop-color="#45baf0" stop-opacity=".36"/>
      <stop offset="1" stop-color="#45baf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="corner" gradientUnits="userSpaceOnUse" x1="648" y1="406" x2="849" y2="332">
      <stop stop-color="#2071a9" stop-opacity="0"/>
      <stop offset=".78" stop-color="#258fcc" stop-opacity=".13"/>
      <stop offset="1" stop-color="#258fcc" stop-opacity=".23"/>
    </linearGradient>
    <clipPath id="panel-clip">
      <rect x="28.5" y="115.5" width="823" height="290" rx="14"/>
    </clipPath>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; fill: #f2f6fa; }
      .muted { fill: #c6d0da; }
      .icon { fill: none; stroke: #65c4ef; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .separator { stroke: #30424f; }
      .benefit { font-size: 12.5px; font-weight: 550; }
    </style>
  </defs>

  <rect x=".5" y=".5" width="879" height="429" rx="16" fill="url(#background)" stroke="#263642"/>

  <g aria-label="Apoie meus estudos">
    <rect x="47.5" y="16.5" width="41" height="29" rx="7" fill="#13232e" stroke="#3279a0"/>
    <path class="icon" d="m62 26-5 5 5 5m12-10 5 5-5 5m-4-13-4 16" stroke-width="2.2"/>
    <path d="M109.5 17v28" stroke="#73b9e6"/>
    <text id="heading" x="128" y="40" font-size="31" font-weight="750" letter-spacing="-.55">Apoie <tspan fill="#7ec6f2">meus estudos</tspan></text>
    <path d="M480 30h349" stroke="url(#header-rule)"/>
    <circle cx="829" cy="30" r="12" fill="url(#header-glow)"/>
    <circle cx="829" cy="30" r="2.5" fill="#58bde9"/>
  </g>
  <g id="intro" class="muted" font-size="16.5">
    <text x="50" y="73" class="muted">Se algum dos meus projetos te ajudou, considere contribuir voluntariamente</text>
    <text x="50" y="94" class="muted">para apoiar meus estudos e formação em tecnologia.</text>
  </g>

  <rect x="28.5" y="115.5" width="823" height="290" rx="14" fill="url(#panel)"/>
  <g clip-path="url(#panel-clip)">
    <path d="M28 356h824v50H28z" fill="#152029"/>
    <path d="M604 406c91-14 183-28 248-58v58Z" fill="url(#corner)"/>
    <path d="M655 406c69-22 148-25 197-61" fill="none" stroke="#3399ce" stroke-opacity=".22"/>
  </g>
  <rect x="28.5" y="115.5" width="823" height="290" rx="14" fill="none" stroke="#344958"/>

  <g id="pix-heading">
    <rect x="60.5" y="144.5" width="71" height="62" rx="15" fill="url(#button)" stroke="#314452"/>
    <path d="M24 36 8 21C-3 10 12-2 21 8l3 3 3-3c9-10 24 2 13 13Z" class="icon" transform="translate(72 155)" style="stroke:#51c3ed;stroke-width:2.8"/>
    <text x="149" y="167" font-size="29" font-weight="750" letter-spacing="-.35">Contribua via <tspan fill="#53b8f1">Pix</tspan></text>
    <text x="150" y="193" class="muted" font-size="17">Seu apoio faz a diferença!</text>
  </g>

  <g id="qr-action">
    <rect x="58.5" y="224.5" width="480" height="45" rx="10" fill="url(#button)" stroke="#405c70"/>
    <g class="icon" transform="translate(78 236)">
      <path d="M1 7V2h5m10 0h5v5M1 14v5h5m10 0h5v-5"/>
      <rect x="7" y="6" width="8" height="9" rx="1"/>
