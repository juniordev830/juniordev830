    <text x="111" y="252" class="muted" font-size="15" font-weight="550">QR Code Pix</text>
    <path d="M222.5 235v24" class="separator"/>
    <text x="244" y="252" font-size="15" font-weight="650">Abrir em tamanho maior</text>
    <path class="icon" d="M498 238h11v11m0-11-12 12m9-4v8h-14v-14h8"/>
  </g>

  <g id="benefits" class="benefit">
    <path d="M185.5 289v34m120-34v34m111-34v34" class="separator"/>
    <g id="benefit-projects" transform="translate(58 286)">
