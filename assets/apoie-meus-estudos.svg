    <g id="benefit-studies" transform="translate(425 286)">
      <path class="icon" d="m0 17 10-6 11 6-11 6Zm4 3v7c4 3 9 3 13 0v-7m4-3v11"/>
      <text x="29" y="16">Apoia</text>
      <text x="29" y="32">meus estudos</text>
    </g>
  </g>

