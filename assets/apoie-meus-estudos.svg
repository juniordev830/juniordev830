      <text x="27" y="16">Viabiliza</text>
      <text x="27" y="32">novas ideias</text>
    </g>
    <g id="benefit-evolution" transform="translate(314 286)">
      <path class="icon" d="M4 22c2-8 9-13 19-14-1 10-6 17-14 19Zm2-6-5 3 1 4 5-1m9-2-1 6-5 4-1-4m-3-1-4 4m12-14h.1"/>
      <text x="29" y="16">Acelera</text>
      <text x="29" y="32">evoluções</text>
